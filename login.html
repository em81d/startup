<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="icon" type="image/png" href="chatlogo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-title" href="index.html">Chat260</a>
        <nav>
          <ul class="site-nav">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link nav-link-active" href="login.html">Login</a></li>
            <li><a class="nav-link" href="chat.html">Chat</a></li>
            <li><a class="nav-link" href="progress.html">Progress</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page flex flex-col items-center justify-center">
      <h2 class="text-center">Login</h2>

      <section class="card mt-6 w-full max-w-sm">
        <form class="space-y-4">
          <div>
            <label class="field-label" for="email">Email</label>
            <input class="field-input" type="email" id="email" name="email" placeholder="your@email.com" />
          </div>
          <div>
            <label class="field-label" for="password">Password</label>
            <input class="field-input" type="password" id="password" name="password" placeholder="password" />
          </div>
          <div class="flex justify-center gap-3 pt-2">
            <button class="btn" type="submit">Login</button>
            <button class="btn-secondary" type="submit">Sign Up</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <div class="flex items-center gap-3">
          <img src="chatlogo.png" alt="Chat260 logo" width="64" height="64" class="rounded-lg" />
          <div>
            <p class="font-medium text-mist-700">Thanks for using Chat260!</p>
            <p>by Emeline MacJanet</p>
          </div>
        </div>
        <a href="https://github.com/em81d/startup">GitHub</a>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
