<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="icon" type="image/png" href="chatlogo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-title" href="index.html">Chat260</a>
        <nav>
          <ul class="site-nav">
            <li><a class="nav-link" href="index.html">Home</a></li>
            <li><a class="nav-link" href="login.html">Login</a></li>
            <li><a class="nav-link nav-link-active" href="chat.html">Chat</a></li>
            <li><a class="nav-link" href="progress.html">Progress</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page">
      <h2>Chat</h2>

      <section class="card mt-6 max-w-2xl">
        <h3>Ready when you are</h3>
        <p class="mt-2 text-mist-600">
          Your bot picks up right where you left off.
        </p>
        <button class="btn mt-5" type="button">Click to start conversation</button>
      </section>

      <section class="card card-accent mt-6 max-w-2xl">
        <h3>Focus for this conversation</h3>
        <ul class="mt-3 list-inside list-disc space-y-1 text-mist-700">
          <li>Using past tense</li>
          <li>Talking about professions</li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <div class="flex items-center gap-3">
          <img src="chatlogo.png" alt="Chat260 logo" width="64" height="64" class="rounded-lg" />
          <div>
            <p class="font-medium text-mist-700">Thanks for using Chat260!</p>
            <p>by Emeline MacJanet</p>
          </div>
        </div>
        <a href="https://github.com/em81d/startup">GitHub</a>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
